[[bin]]
name = "Mountain"
path = "Source/Library.rs"

[build-dependencies]
json5 = { workspace = true }
toml_edit = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri-build = { workspace = true, features = [] }
toml = { workspace = true }
tonic-build = { workspace = true, features = ["transport"] }
tonic-prost-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = [
	"compression",
	"devtools",
	"image-png",
	"rustls-tls",
	"tray-icon",
	"wry",
], default-features = false }

tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-localhost = { workspace = true }
tauri-plugin-log = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
colored = { workspace = true }
Common = { workspace = true }
dirs = { workspace = true }
Echo = { workspace = true }
Air = { workspace = true, optional = true }
env_logger = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
globset = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
http = { workspace = true }
ignore = { workspace = true }
keyring = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
md5 = { workspace = true }
num_cpus = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
portable-pty = { workspace = true }
portpicker = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hostname = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tokio-util = { workspace = true, features = ["full"] }
toml = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
flate2 = { workspace = true }
ring = { workspace = true }
bincode = { workspace = true }
brotli = { workspace = true }
hex = { workspace = true }
opentelemetry = { workspace = true }

[features]
default = ["ExtensionHostCocoon", "MistNative", "AirIntegration"]

ExtensionHostCocoon = []

MistNative = []

Debug = []

AirIntegration = ["Air"]

# Feature flags for conditional compilation
grove = []
cocoon = []
terminals = []
debug-protocol = []
scm-support = []
child-processes = []
Telemetry = []
Development = []
Test = []

[lib]
name = "Mountain"
path = "Source/Library.rs"
crate-type = ["lib"]

[package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
default-run = "Mountain"
description = "Mountain ⛰️"
edition = "2021"
license-file = "LICENSE"
name = "Mountain"
publish = false
include = [
	"build.rs",
	"capabilities/**/*",
	"Cargo.toml",
	"CHANGELOG.md",
	"gen/**/*",
	"icons/**/*",
	"LICENSE",
	"Mountain.key.pub",
	"Proto/**/*",
	"README.md",
	"Source/**/*",
	"tauri.conf.json",
	"Test/**/*",
]
version = "0.0.1"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = [
	"x86_64-unknown-linux-gnu",
	"x86_64-apple-darwin",
	"aarch64-apple-darwin",
]
