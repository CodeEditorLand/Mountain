[[bin]]
name = "Mountain"
path = "Source/Library.rs"

[build-dependencies]
json5 = { workspace = true }
toml_edit = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri-build = { workspace = true, features = [] }
toml = { workspace = true }

[dependencies]
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
once_cell = { workspace = true }
tauri = { version = "2.5.1", features = [
	"wry",
	"tray-icon",
	"devtools",
	"rustls-tls",
	"compression",
], default-features = false, git = "https://github.com/tauri-apps/tauri", branch = "feat/mobile-dev-cert" }
log = { workspace = true }
env_logger = { workspace = true }
colored = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
dirs = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
keyring = { workspace = true }
base64 = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
Echo = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# regex = { workspace = true }
# unbug = { workspace = true }

[features]
default = ["extension_host_cocoon", "mist_native"]

extension_host_cocoon = []

mist_native = []

Debug = []

[lib]
name = "Mountain"
path = "Source/Library.rs"
crate-type = ["lib"]

[package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
default-run = "Mountain"
description = "Mountain ⛰️"
edition = "2024"
license-file = "LICENSE"
name = "Mountain"
publish = false
version = "0.0.1"
