[[bin]]
name = "Mountain"
path = "Source/Library.rs"

[build-dependencies]
json5 = { workspace = true }
toml_edit = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri-build = { workspace = true, features = [] }
toml = { workspace = true }
tonic-build = { workspace = true, features = ["transport"] }
tonic-prost-build = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }

[dependencies]
tauri = { workspace = true, features = [
	"compression",
	"devtools",
	"image-png",
	"land-emit-buffer",
	"land-simd-json",
	"rustls-tls",
	"tray-icon",
	"wry",
], default-features = false }

tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-localhost = { workspace = true }
tauri-plugin-log = { workspace = true }

async-trait = { workspace = true }
anyhow = { workspace = true }                                                    # TODO: Added for error handling in CertificateManager
arboard = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
colored = { workspace = true }
Common = { workspace = true }
dirs = { workspace = true }
Echo = { workspace = true }
Air = { workspace = true }
Cache = { workspace = true }
Mist = { workspace = true }
Vine = { workspace = true, features = ["multiplexer"] }
env_logger = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
globset = { workspace = true }
grep-matcher = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
http = { workspace = true }
ignore = { workspace = true }
keyring = { workspace = true }
keyring-core = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
md5 = { workspace = true }
notify = { workspace = true }
num_cpus = { workspace = true }
once_cell = { workspace = true }
memmap2 = { workspace = true }
moka = { workspace = true }
dunce = { workspace = true }
dashmap = { workspace = true }
open = { workspace = true }
parking_lot = { workspace = true }
portable-pty = { workspace = true }
portpicker = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true }
hostname = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tokio-util = { workspace = true, features = ["full"] }
pem = { workspace = true }
rcgen = { workspace = true }
p256 = { workspace = true }
x509-parser = { workspace = true }
rustls-pki-types = { workspace = true }
rustls = { workspace = true }                                                    # TODO: Added for TLS configuration in CertificateManager
toml = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
flate2 = { workspace = true }
ring = { workspace = true }
bincode = { workspace = true }
brotli = { workspace = true }
hex = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
posthog-rs = { workspace = true }
zip = { workspace = true }

[features]
default = [
	"ExtensionHostCocoon",
	"MistNative",
	"AirIntegration",
	"terminals",
	"debug-protocol",
	"scm-support",
	"child-processes",
	"Development",
	# Experimental tier flags (Task 02 - High Priority)
	"TierExtensionScanParallel",
	"TierFileWatcherLayer4",
	"TierFindFilesLayer4",
	"TierGlobNative",
	"TierFileSystemLayer4",
	"TierRemoteProcedureCallSharedMemory",
	# Subsystem feature flags
	"Terminal",
	"SCM",
	"Debug",
	"LanguageFeatures",
	"Search",
	"OutputChannel",
	"NativeHost",
	"TreeView",
	"Storage",
	"Model",
	"FileSystem",
	"Encryption",
	"Tasks",
	"Auth",
	"ExtensionHost",
]

ExtensionHostCocoon = []

MistNative = []

Debug = []

AirIntegration = []

# Feature flags for conditional compilation
terminals = []

debug-protocol = []

scm-support = []

child-processes = []

Development = []

# Tier flags
TierExtensionScanParallel = []
TierFileWatcherLayer4 = []
TierFindFilesLayer4 = []
TierGlobNative = []
TierFileSystemLayer4 = []
TierRemoteProcedureCallSharedMemory = []

# Subsystem features
Terminal = []
SCM = []
LanguageFeatures = []
Search = []
OutputChannel = []
NativeHost = []
TreeView = []
Storage = []
Model = []
Encryption = []
Tasks = []
Auth = []
ExtensionHost = []

FileSystem = []

# Shim tier (experimental)
Shim = []

# Tier-gating feature flags — each mirrors a name in build.rs::IsDeclaredTierFeature

[lib]
name = "Mountain"
path = "Source/Library.rs"
crate-type = ["lib", "staticlib"]

[package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
default-run = "Mountain"
description = "Mountain ⛰️"
edition = "2024"
license-file = "LICENSE"
name = "Mountain"
publish = false
include = [
	"build.rs",
	"capabilities/**/*",
	"Cargo.toml",
	"CHANGELOG.md",
	"gen/**/*",
	"icons/**/*",
	"LICENSE",
	"Mountain.key.pub",
	"Proto/**/*",
	"README.md",
	"Source/**/*",
	"tauri.conf.json",
	"Test/**/*",
]
version = "0.0.1"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = [
	"x86_64-unknown-linux-gnu",
	"x86_64-apple-darwin",
	"aarch64-apple-darwin",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(no_node_host)"] }
