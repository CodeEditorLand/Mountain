  string ViewId = 1;
  string TreeItemHandle = 2;
}

// Response with tree children.
message GetTreeChildrenResponse {
  repeated TreeItem Items = 1;
}

message TreeItem {
  string Handle = 1;
  string Label = 2;
  bool IsCollapsed = 3;
  string Icon = 4;
}

// ==================== SCM ====================

// Request to register an SCM provider.
message RegisterScmProviderRequest {
  string SCMId = 1;
  string ExtensionId = 2;
}

// Request to update SCM group.
message UpdateScmGroupRequest {
  string ProviderId = 1;
  string GroupId = 2;
  repeated SourceControlResourceState ResourceStates = 3;
}

message SourceControlResourceState {
  Uri Uri = 1;
  string State = 2;
  string Decorations = 3;
}

// Request to execute a git command.
message GitExecRequest {
  string RepositoryPath = 1;
  repeated string Args = 2;
}

// Response from git execution.
message GitExecResponse {
  repeated string Output = 1;
  int32 ExitCode = 2;
}

// ==================== Debug ====================

// Request to register a debug adapter.
message RegisterDebugAdapterRequest {
  string DebugType = 1;
  string ExtensionId = 2;
}

message DebugConfiguration {
  string Type = 1;
  string Name = 2;
  string Request = 3;
  map<string, string> Options = 4;
}

// Request to start debugging.
message StartDebuggingRequest {
  string DebugType = 1;
  DebugConfiguration Configuration = 2;
}

// Response for starting debugging.
message StartDebuggingResponse {
  bool Success = 1;
}

// ==================== Save Participants ====================

// Request to participate in save.
message ParticipateInSaveRequest {
  Uri Uri = 1;
  TextDocumentSaveReason Reason = 2;
}

message TextEditForSave {
  Uri Uri = 1;
  repeated TextEdit Edits = 2;
}

// Response for participating in save.
message ParticipateInSaveResponse {
  repeated TextEditForSave Edits = 1;
}

// ==================== Secret Storage ====================

// Request to get a secret.
message GetSecretRequest {
  string Key = 1;
}

// Response with secret value.
message GetSecretResponse {
  string Value = 1;
}

// Request to store a secret.
message StoreSecretRequest {
  string Key = 1;
  string Value = 2;
}

// Request to delete a secret.
message DeleteSecretRequest {
  string Key = 1;
}

// ==================== Language Features (Extended) Messages ====================

// Document filter for language selector.
message DocumentFilter {
  string Language = 1;
  string Scheme = 2;
  string Pattern = 3;
}

// Request for document highlights.
message ProvideDocumentHighlightsRequest {
  Uri Uri = 1;
  Position Position = 2;
  uint32 ProviderHandle = 3;
}

// A document highlight.
message DocumentHighlight {
  Range Range = 1;
  // 0 = Text, 1 = Read, 2 = Write
  uint32 Kind = 2;
}

// Response with document highlights.
message ProvideDocumentHighlightsResponse {
  repeated DocumentHighlight Highlights = 1;
}

// Request for document symbols.
message ProvideDocumentSymbolsRequest {
  Uri Uri = 1;
  uint32 ProviderHandle = 2;
}

// A document symbol.
message DocumentSymbol {
  string Name = 1;
  string Detail = 2;
  // SymbolKind enum value
  uint32 Kind = 3;
  Range Range = 4;
  Range SelectionRange = 5;
  repeated DocumentSymbol Children = 6;
}

// Response with document symbols.
message ProvideDocumentSymbolsResponse {
  repeated DocumentSymbol Symbols = 1;
}

// Request for workspace symbols.
message ProvideWorkspaceSymbolsRequest {
  string Query = 1;
  uint32 ProviderHandle = 2;
}

// A workspace symbol.
message WorkspaceSymbol {
  string Name = 1;
  // SymbolKind enum value
  uint32 Kind = 2;
  Location Location = 3;
  string ContainerName = 4;
}

// Response with workspace symbols.
message ProvideWorkspaceSymbolsResponse {
  repeated WorkspaceSymbol Symbols = 1;
}

// Request for rename edits.
message ProvideRenameEditsRequest {
  Uri Uri = 1;
  Position Position = 2;
  string NewName = 3;
  uint32 ProviderHandle = 4;
}

// A workspace edit containing edits across multiple files.
message WorkspaceEdit {
  repeated TextEditForSave Edits = 1;
}

// Response with rename edits.
message ProvideRenameEditsResponse {
  WorkspaceEdit WorkspaceEdit = 1;
}

// Request for document formatting.
message ProvideDocumentFormattingRequest {
  Uri Uri = 1;
  uint32 TabSize = 2;
  bool InsertSpaces = 3;
  uint32 ProviderHandle = 4;
}

// Response with formatting edits.
message ProvideDocumentFormattingResponse {
  repeated TextEdit Edits = 1;
}

// Request for range formatting.
message ProvideDocumentRangeFormattingRequest {
  Uri Uri = 1;
  Range Range = 2;
  uint32 TabSize = 3;
  bool InsertSpaces = 4;
  uint32 ProviderHandle = 5;
}

// Response with range formatting edits.
message ProvideDocumentRangeFormattingResponse {
  repeated TextEdit Edits = 1;
}

// Request to register on-type formatting provider with trigger characters.
message RegisterOnTypeFormattingProviderRequest {
  string LanguageSelector = 1;
  uint32 Handle = 2;
  string ExtensionId = 3;
  repeated string TriggerCharacters = 4;
}

// Request for on-type formatting.
message ProvideOnTypeFormattingRequest {
  Uri Uri = 1;
  Position Position = 2;
  string Character = 3;
  uint32 TabSize = 4;
  bool InsertSpaces = 5;
  uint32 ProviderHandle = 6;
}

// Response with on-type formatting edits.
message ProvideOnTypeFormattingResponse {
  repeated TextEdit Edits = 1;
}

// Request to register signature help provider with metadata.
message RegisterSignatureHelpProviderRequest {
  string LanguageSelector = 1;
  uint32 Handle = 2;
  string ExtensionId = 3;
  repeated string TriggerCharacters = 4;
  repeated string RetriggerCharacters = 5;
}

// Request for signature help.
message ProvideSignatureHelpRequest {
  Uri Uri = 1;
  Position Position = 2;
  uint32 ProviderHandle = 3;
}

// A parameter information.
message ParameterInformation {
  string Label = 1;
  string Documentation = 2;
}

// A signature information.
message SignatureInformation {
  string Label = 1;
  string Documentation = 2;
  repeated ParameterInformation Parameters = 3;
  uint32 ActiveParameter = 4;
}

// Response with signature help.
message ProvideSignatureHelpResponse {
  repeated SignatureInformation Signatures = 1;
  uint32 ActiveSignature = 2;
  uint32 ActiveParameter = 3;
}

// Request for code lenses.
message ProvideCodeLensesRequest {
  Uri Uri = 1;
  uint32 ProviderHandle = 2;
}

// A code lens.
message CodeLens {
  Range Range = 1;
  string CommandId = 2;
  string CommandTitle = 3;
  repeated Argument CommandArguments = 4;
}

// Response with code lenses.
message ProvideCodeLensesResponse {
  repeated CodeLens Lenses = 1;
}

// Request for folding ranges.
message ProvideFoldingRangesRequest {
  Uri Uri = 1;
  uint32 ProviderHandle = 2;
}

// A folding range.
message FoldingRange {
  uint32 StartLine = 1;
  uint32 EndLine = 2;
  // 0 = Comment, 1 = Imports, 2 = Region
  uint32 Kind = 3;
}

// Response with folding ranges.
message ProvideFoldingRangesResponse {
  repeated FoldingRange Ranges = 1;
}

// Request for selection ranges.
message ProvideSelectionRangesRequest {
  Uri Uri = 1;
  repeated Position Positions = 2;
  uint32 ProviderHandle = 3;
}

// A selection range (nested).
message SelectionRange {
  Range Range = 1;
}

// Response with selection ranges.
message ProvideSelectionRangesResponse {
  repeated SelectionRange Ranges = 1;
}

// Request to register semantic tokens provider with legend.
message RegisterSemanticTokensProviderRequest {
  string LanguageSelector = 1;
  uint32 Handle = 2;
  string ExtensionId = 3;
  repeated string TokenTypes = 4;
  repeated string TokenModifiers = 5;
}

// Request for semantic tokens.
message ProvideSemanticTokensRequest {
  Uri Uri = 1;
  uint32 ProviderHandle = 2;
}

// Response with semantic tokens (encoded as delta array per LSP spec).
message ProvideSemanticTokensResponse {
  // Flat array: [deltaLine, deltaStartChar, length, tokenType, tokenModifiers, ...]
  repeated uint32 Data = 1;
  uint32 ResultId = 2;
}

// Request for inlay hints.
message ProvideInlayHintsRequest {
  Uri Uri = 1;
  Range Range = 2;
  uint32 ProviderHandle = 3;
}

// An inlay hint.
message InlayHint {
  Position Position = 1;
  string Label = 2;
  // 0 = Type, 1 = Parameter
  uint32 Kind = 3;
  string Tooltip = 4;
  bool PaddingLeft = 5;
  bool PaddingRight = 6;
}

// Response with inlay hints.
message ProvideInlayHintsResponse {
  repeated InlayHint Hints = 1;
}

// A type hierarchy item (used for both supertypes and subtypes).
message TypeHierarchyItem {
  string Name = 1;
  uint32 Kind = 2;
  Uri Uri = 3;
  Range Range = 4;
  Range SelectionRange = 5;
  string Detail = 6;
}

// Request for type hierarchy.
message ProvideTypeHierarchyRequest {
  Uri Uri = 1;
  Position Position = 2;
  uint32 ProviderHandle = 3;
  TypeHierarchyItem Item = 4;
}

// Response with type hierarchy items.
message ProvideTypeHierarchyResponse {
  repeated TypeHierarchyItem Items = 1;
}

// A call hierarchy item (used for both incoming and outgoing calls).
message CallHierarchyItem {
  string Name = 1;
  uint32 Kind = 2;
  Uri Uri = 3;
  Range Range = 4;
  Range SelectionRange = 5;
  string Detail = 6;
}

// Request for call hierarchy.
message ProvideCallHierarchyRequest {
  Uri Uri = 1;
  Position Position = 2;
  uint32 ProviderHandle = 3;
  CallHierarchyItem Item = 4;
}

// A call hierarchy call.
message CallHierarchyCall {
  CallHierarchyItem FromOrTo = 1;
  repeated Range FromRanges = 2;
}

// Response with call hierarchy.
message ProvideCallHierarchyResponse {
  repeated CallHierarchyCall Calls = 1;
}

// Request for linked editing ranges.
message ProvideLinkedEditingRangesRequest {
  Uri Uri = 1;
  Position Position = 2;
  uint32 ProviderHandle = 3;
}

// Response with linked editing ranges.
message ProvideLinkedEditingRangesResponse {
  repeated Range Ranges = 1;
  string WordPattern = 2;
}

// ==================== Window Operations (Extended) Messages ====================

// A quick pick item.
message QuickPickItem {
  string Label = 1;
  string Description = 2;
  string Detail = 3;
  bool Picked = 4;
  bool AlwaysShow = 5;
}

// Request to show a quick pick.
message ShowQuickPickRequest {
  repeated QuickPickItem Items = 1;
  string Placeholder = 2;
  bool CanPickMany = 3;
  string Title = 4;
}

// Response with selected quick pick item(s).
message ShowQuickPickResponse {
  repeated uint32 SelectedIndices = 1;
}

// Request to show an input box.
message ShowInputBoxRequest {
  string Prompt = 1;
  string Value = 2;
  string Placeholder = 3;
  string Title = 4;
  bool Password = 5;
}

// Response with input box value.
message ShowInputBoxResponse {
  string Value = 1;
  bool Cancelled = 2;
}

// Progress location.
enum ProgressLocation {
  PROGRESS_LOCATION_NOTIFICATION = 0;
  PROGRESS_LOCATION_SOURCE_CONTROL = 1;
  PROGRESS_LOCATION_WINDOW = 2;
}

// Request to show a progress indicator.
message ShowProgressRequest {
  uint32 Handle = 1;
  ProgressLocation Location = 2;
  string Title = 3;
  bool Cancellable = 4;
  string ExtensionId = 5;
}

// Response acknowledging progress start.
message ShowProgressResponse {
  uint32 Handle = 1;
}

// Request to report progress.
message ReportProgressRequest {
  uint32 Handle = 1;
  string Message = 2;
  uint32 Increment = 3;
}

// Request to post a message to a webview.
message PostWebviewMessageRequest {
  uint32 Handle = 1;
  oneof Message {
    string StringMessage = 2;
    bytes BytesMessage = 3;
  }
}

// Request to dispose a webview panel.
message DisposeWebviewPanelRequest {
  uint32 Handle = 1;
}

// Request to open an external URI.
message OpenExternalRequest {
  string Uri = 1;
}

// ==================== File System (Extended) Messages ====================

// Request to delete a file.
message DeleteFileRequest {
  Uri Uri = 1;
  bool Recursive = 2;
  bool UseTrash = 3;
}

// Request to rename a file.
message RenameFileRequest {
  Uri Source = 1;
  Uri Target = 2;
  bool Overwrite = 3;
}

// Request to copy a file.
message CopyFileRequest {
  Uri Source = 1;
  Uri Target = 2;
  bool Overwrite = 3;
}

// Request to create a directory.
message CreateDirectoryRequest {
  Uri Uri = 1;
}

// ==================== Output Channel Messages ====================

// Request to create an output channel.
message CreateOutputChannelRequest {
  string Name = 1;
  string LanguageId = 2;
  string ExtensionId = 3;
}

// Response with channel ID.
message CreateOutputChannelResponse {
  string ChannelId = 1;
}

// Request to append to an output channel.
message AppendOutputRequest {
  string ChannelId = 1;
  string Value = 2;
}

// Request to clear an output channel.
message ClearOutputRequest {
  string ChannelId = 1;
}

// Request to show an output channel.
message ShowOutputRequest {
  string ChannelId = 1;
  bool PreserveFocus = 2;
}

// Request to dispose an output channel.
message DisposeOutputRequest {
  string ChannelId = 1;
}

// ==================== Task Messages ====================

// A task definition.
message TaskDefinition {
  string Type = 1;
  map<string, string> Attributes = 2;
}

// Request to register a task provider.
message RegisterTaskProviderRequest {
  string Type = 1;
  string ExtensionId = 2;
}

// Request to execute a task.
message ExecuteTaskRequest {
  TaskDefinition Definition = 1;
  string Name = 2;
  string Source = 3;
}

// Response with task execution.
message ExecuteTaskResponse {
  uint32 TaskId = 1;
  bool Success = 2;
}

// Request to terminate a task.
message TerminateTaskRequest {
  uint32 TaskId = 1;
}

// ==================== Authentication Messages ====================

// Request to get an authentication session.
message GetAuthenticationSessionRequest {
  string ProviderId = 1;
  repeated string Scopes = 2;
  string ExtensionId = 3;
  bool CreateIfNone = 4;
  bool ClearSessionPreference = 5;
}

// Response with authentication session.
message GetAuthenticationSessionResponse {
  string Id = 1;
  string AccessToken = 2;
  string AccountLabel = 3;
  string AccountId = 4;
  repeated string Scopes = 5;
}

// Request to register an authentication provider.
message RegisterAuthenticationProviderRequest {
  string Id = 1;
  string Label = 2;
  bool SupportsMultipleAccounts = 3;
  string ExtensionId = 4;
}

// ==================== Debug (Extended) Messages ====================

// Request to stop debugging.
message StopDebuggingRequest {
  string SessionId = 1;
}

// ==================== Extension Messages ====================

// Request to get an extension.
message GetExtensionRequest {
  string ExtensionId = 1;
}

// Extension information.
message ExtensionInfo {
  string Id = 1;
  string DisplayName = 2;
  string Version = 3;
  bool IsActive = 4;
  string ExtensionPath = 5;
}

// Response with extension info.
message GetExtensionResponse {
  ExtensionInfo Extension = 1;
}

// Response with all extensions.
message GetAllExtensionsResponse {
  repeated ExtensionInfo Extensions = 1;
}

// ==================== Terminal (Extended) Messages ====================

// Request to resize a terminal.
message ResizeTerminalRequest {
  uint32 TerminalId = 1;
  uint32 Cols = 2;
  uint32 Rows = 3;
}

// ==================== Configuration (Extended) Messages ====================

// Request to get a configuration value.
message GetConfigurationRequest {
  string Section = 1;
  string Key = 2;
}

// Response with configuration value.
message GetConfigurationResponse {
  bytes Value = 1;
}

// ==================== Inline Completion Messages ====================

// Context passed when requesting inline completions.
message InlineCompletionContext {
  // 0 = Invoke (user explicitly triggered), 1 = Automatic (cursor pause)
  int32 TriggerKind = 1;
  // JSON-serialised SelectedCompletionInfo if a completion is already showing.
  string SelectedCompletionInfo = 2;
}

// Request for inline completion items (e.g. GitHub Copilot ghost text).
message ProvideInlineCompletionRequest {
  Uri Uri = 1;
  Position Position = 2;
  uint32 ProviderHandle = 3;
  InlineCompletionContext Context = 4;
}

// A single inline completion suggestion.
message InlineCompletionItem {
  // The text to insert. May be a plain string or a SnippetString.
  string InsertText = 1;
  // The range to replace (optional; defaults to cursor position if empty).
  Range Range = 2;
  // Command to execute after accepting the completion (e.g. trigger suggest).
  string Command = 3;
  // Whether InsertText is a snippet string.
  bool IsSnippet = 4;
}

// Response carrying inline completion items.
message ProvideInlineCompletionResponse {
  repeated InlineCompletionItem Items = 1;
}
