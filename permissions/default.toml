# Mountain app-level Tauri command permissions.
#
# Tauri 2's IPC authority gates every `#[tauri::command]` behind an
# explicit allow entry in some capability. Without a permission file
# under this `permissions/` directory, all app-level commands invoked
# from the webview are rejected with
# `<command> not allowed. Plugin not found` (the runtime first looks
# up the command name as `plugin:command`, fails, then reports no
# matching ACL entry).
#
# Plugin permissions (`core:*`, `dialog:*`, `fs:*`, `log:*`) are
# auto-generated by their crates' `tauri-build` hooks and referenced
# directly in `capabilities/default.json`. App commands carry no such
# autogen because Mountain's `build.rs` calls
# `tauri_build::build()` with default attributes (no
# `AppManifest::commands(&[...])`). Hand-writing the allow list here
# is functionally equivalent and avoids a `build.rs` rerun every time
# the command set grows.
#
# Source of truth for the list: the `invoke_handler(generate_handler![
# ... ])` block in `Source/Binary/Main/Entry.rs`. Add a new command
# there + here in the same PR. The permission identifier convention
# is `allow-<exact-rust-fn-name>` (case-sensitive - Tauri's authority
# matches the command name verbatim against `commands.allow`).
#
# The aggregate `default` permission set is what
# `capabilities/default.json` references via the bare `"default"`
# entry (no `plugin:` prefix because these are app commands).

[default]
description = "Allow every Mountain app-defined Tauri command from any window served by the localhost plugin."
permissions = ["allow-mountain-commands"]

[[permission]]
identifier = "allow-mountain-commands"
description = "Aggregate allow-list for every #[tauri::command] in Mountain. See Source/Binary/Main/Entry.rs `invoke_handler` block for the source of truth."
commands.allow = [
	"SwitchTrayIcon",
	"MountainGetWorkbenchConfiguration",
	"GetTreeViewChildren",
	"MountainProvideHover",
	"MountainProvideCompletions",
	"MountainProvideDefinition",
